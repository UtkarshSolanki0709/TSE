services:
  - type: web
    name: tse-backend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MODE
        value: cloud
      - key: DATABASE_URL
        fromDatabase:
          name: tse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://tse-rdsb.onrender.com
      - key: CORS_ORIGIN
        value: https://tse-rdsb.onrender.com
      - key: VITE_MODE
        value: cloud
      - key: VITE_API_URL
        value: /api
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

databases:
  - name: tse-db
    plan: free
