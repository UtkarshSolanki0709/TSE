<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 16px; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .header img { width: 24px; height: 24px; }
    .header h1 { font-size: 14px; font-weight: 600; color: #fff; }
    .url-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; padding: 8px 10px; font-size: 11px; color: #888; word-break: break-all; margin-bottom: 12px; max-height: 40px; overflow: hidden; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .btn-primary { background: #4f8cff; color: #fff; }
    .btn-primary:hover { background: #3a7ae8; }
    .btn-primary:disabled { background: #2a4a7a; color: #888; cursor: not-allowed; }
    .status { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 12px; display: none; }
    .status.success { display: block; background: #0d2a0d; color: #4ade80; border: 1px solid #166534; }
    .status.error { display: block; background: #2a0d0d; color: #f87171; border: 1px solid #653434; }
    .status.loading { display: block; background: #1a1a2e; color: #818cf8; border: 1px solid #312e81; }
    .meta { margin-top: 10px; font-size: 11px; color: #666; display: flex; justify-content: space-between; }
    .config { margin-top: 10px; padding-top: 10px; border-top: 1px solid #2a2a2a; }
    .config label { font-size: 11px; color: #888; display: block; margin-bottom: 4px; }
    .config input { width: 100%; padding: 6px 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 4px; color: #e0e0e0; font-size: 12px; }
    .config input:focus { outline: none; border-color: #4f8cff; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="TSE">
    <h1>TSE Scraper</h1>
  </div>
  <div style="margin-bottom: 8px; padding: 4px 8px; background: #0d2315; border: 1px solid #165b32; border-radius: 4px; font-size: 10px; color: #4ade80; display: flex; align-items: center; gap: 4px;">
    <span>🔒</span>
    <span>Local-First Storage (Device Only)</span>
  </div>
  <div class="url-box" id="current-url">Loading...</div>
  <button class="btn btn-primary" id="scrape-btn">Index This Page</button>
  <div class="status" id="status"></div>
  <div class="meta">
    <span id="page-title"></span>
    <span id="content-length"></span>
  </div>
  <div class="config">
    <label for="api-url">Local Backend URL</label>
    <input type="text" id="api-url" value="http://127.0.0.1:3000" placeholder="http://127.0.0.1:3000">
  </div>
  <script src="popup.js"></script>
</body>
</html>
